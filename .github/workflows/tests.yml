name: Tests

# Runs the tests on every push and pull request. Deploying happens from your Mac with ./deploy.sh.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: JavaScript tests and types
        # The Laravel Vite plugin refuses to start Vitest in CI otherwise.
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Check that the committed assets match the source
        run: |
          npm run build
          git diff --exit-code --stat -- public/build || {
            echo "::error::public/build is out of date. Run 'npm run build' locally and commit the result."
            exit 1
          }
          test -z "$(git status --porcelain -- public/build)" || {
            echo "::error::public/build has new files. Run 'npm run build' locally and commit the result."
            exit 1
          }

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
